name: protidhoni

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-protidhoni}
      POSTGRES_USER: ${POSTGRES_USER:-protidhoni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      PROTIDHONI_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PROTIDHONI_AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Set AI_INTERNAL_TOKEN in .env}
      PROTIDHONI_AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      PROTIDHONI_RESPONDER_TOKEN: ${RESPONDER_TOKEN:?Set RESPONDER_TOKEN in .env}
      PROTIDHONI_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PROTIDHONI_DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      # Optional: blank values disable the SMS/USSD path, they do not weaken it.
      PROTIDHONI_GATEWAY_PRIVATE_KEY: ${GATEWAY_PRIVATE_KEY:-}
      PROTIDHONI_GATEWAY_WEBHOOK_TOKEN: ${GATEWAY_WEBHOOK_TOKEN:-}
      PROTIDHONI_GATEWAY_USSD_WEBHOOK_TOKEN: ${GATEWAY_USSD_WEBHOOK_TOKEN:-}
      PROTIDHONI_GATEWAY_PHONE_PEPPER: ${GATEWAY_PHONE_PEPPER:-}
      PROTIDHONI_GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      args:
        # Set INSTALL_AI_MODEL_EXTRAS=true in .env to bundle torch/transformers
        # and actually serve the fine-tuned BanglaBERT checkpoint below.
        INSTALL_MODEL_EXTRAS: ${INSTALL_AI_MODEL_EXTRAS:-false}
    environment:
      PROTIDHONI_AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Set AI_INTERNAL_TOKEN in .env}
      PROTIDHONI_TRANSLATION_BASE_URL: ${TRANSLATION_BASE_URL:?Set TRANSLATION_BASE_URL in .env}
      PROTIDHONI_TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      # Blank (default) keeps the transparent rules classifier active. Point
      # this at a local fine-tuned checkpoint directory to serve BanglaBERT
      # instead; see ai-service/README.md. Requires INSTALL_AI_MODEL_EXTRAS=true.
      PROTIDHONI_FINE_TUNED_MODEL_PATH: ${AI_FINE_TUNED_MODEL_PATH:-}
    volumes:
      - ${AI_FINE_TUNED_MODEL_HOST_DIR:-./ai-service/artifacts}:/app/artifacts:ro
    ports:
      - "8001:8001"

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
