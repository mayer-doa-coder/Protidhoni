[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "protidhoni-lora-gateway"
version = "0.1.0"
description = "Meshtastic TCP to Protidhoni report-ingestion gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28,<1.0",
  "meshtastic==2.7.11",
  "protidhoni-lora-protocol==1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[project.scripts]
protidhoni-lora-gateway = "protidhoni_lora_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protidhoni_lora_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../protocol/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

